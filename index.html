<style>

}
*{box-sizing:border-box}

}

.suggest{position:absolute;left:0;right:0;top:78px;background:white;border:1px solid var(--line);border-radius:10px;overflow-x:hidden;overflow-y:auto;height:min(500px,calc(100vh - 430px));min-height:360px;max-height:500px;box-shadow:0 10px 30px rgba(0,0,0,.14);display:none;z-index:20}

.location{display:none;margin-bottom:14px;padding:14px}.location.show{display:block}.location-actions{display:none;margin-top:12px}.location.show .location-actions{display:flex;justify-content:flex-end}
.loc-title{font-size:18px;font-weight:800;margin-bottom:4px}.loc-sub{font-size:13px;color:var(--muted);line-height:1.5}
.section{margin:18px 0 10px}.section h2{font-size:18px;margin:0 0 4px}.section p{margin:0;color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.kpi b{display:block;font-size:18px}.kpi span{font-size:11px;color:var(--muted)}

.legend-item{display:inline-flex;align-items:center;gap:5px}.swatch{width:16px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.swatch.attention{background:var(--attention-bg)}.swatch.alert{background:var(--alert-bg)}

.criteria{display:none;margin-bottom:12px;padding:12px}.criteria.show{display:block}.criteria table{min-width:620px}
.tablecard{overflow:hidden}.scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:980px}
.daily-table{min-width:0;width:100%;table-layout:auto}
.daily-table th,.daily-table td{padding:9px 5px;font-size:12px}
.daily-table th{font-size:11px}

th,td{padding:10px 9px;border-bottom:1px solid #edf2f6;text-align:right;font-size:13px;white-space:nowrap;background:#fff}

tr:last-child td{border-bottom:0}
.hourly-row-highlight td,.daily-row-highlight td{background:var(--row-highlight)}
.hourly-row-highlight td:first-child,.hourly-row-highlight td:nth-child(2),.daily-row-highlight td:first-child,.daily-row-highlight td:nth-child(2){background:var(--row-highlight)}
.now td{background:#fff!important}.now td:first-child{border-left:3px solid var(--navy)!important;background:#fff!important}.now td:nth-child(2){background:#fff!important}
.now .cell-attention,.now .cell-alert{background:#fff!important;color:inherit!important;font-weight:inherit}

.cell-attention{background:var(--attention-bg)!important;color:var(--attention-text)!important;font-weight:700}

.exportbar{display:flex;justify-content:flex-end;margin:10px 0 14px}.export-btn{height:42px;padding:0 16px;background:var(--green);display:inline-flex;align-items:center;gap:8px}.export-btn:hover{filter:brightness(.96)}

@media(max-width:700px){.daily-table{min-width:920px}.daily-table th,.daily-table td{padding:9px 7px;font-size:12px}.daily-table .badge-text{white-space:nowrap}}
@media(max-width:700px){header{position:static}.row{display:block}button{width:100%;height:46px;margin-top:8px}.criteria-link{width:auto;height:auto;margin:0}.suggest{top:78px;height:min(360px,calc(100vh - 330px));min-height:260px;max-height:360px}.summary{grid-template-columns:repeat(2,1fr)}main{margin-top:12px}th,td{padding:9px 8px;font-size:12px}}
</style>
</head>
<body>
<header><div class="brand"><h1>VortixGeo | Consulta Climática</h1><p>Consulta rápida por cidade ou coordenada</p></div></header>
<main>
  <section class="panel">
    <label for="q">Digite uma cidade, bairro ou coordenada</label>
    <div class="searchwrap"><div class="row"><input id="q" autocomplete="off" placeholder="Ex.: Bom Jesus | Bom Jesus, RS | São Paulo, Campo Belo"/><button id="go">Consultar</button></div><div id="suggest" class="suggest"></div></div>
    <div class="hint">Digite primeiro a cidade. Para bairro, use Cidade, Bairro (ex.: São Paulo, Campo Belo). Para filtrar por estado, use Cidade, UF (ex.: Bom Jesus, RS). <b>Busca v18 · Dados TWC</b></div>
    <div id="status" class="status"></div>
  </section>
  <section id="location" class="card location"><div id="locTitle" class="loc-title"></div><div id="locSub" class="loc-sub"></div><div class="location-actions"><button id="exportBtn" class="export-btn" type="button" onclick="exportExcel()" disabled>⬇ Exportar para Excel</button></div></section>
  <div id="loader" class="loader">Carregando dados meteorológicos…</div>
  <div id="results"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let currentExportData = null;
let selected = null, debounceTimer = null;

// Regras totalmente independentes do fornecedor de dados.
const ALERT_RULES = {
  daily: {
    rain_mm:      { attention:{op:'>=',value:10}, alert:{op:'>=',value:30}, label:'Chuva' },
    gust_kmh:     { attention:{op:'>=',value:40}, alert:{op:'>=',value:60}, label:'Vento' },
    temp_max_c:   { attention:{op:'>=',value:33}, alert:{op:'>=',value:36}, label:'Calor' },
    temp_min_c:   { attention:{op:'<=',value:5},  alert:{op:'<=',value:2},  label:'Frio' },
    rh_min_pct:   { attention:{op:'<=',value:30}, alert:{op:'<=',value:20}, label:'Seco' },
    uv_max:       { alert:{op:'>=',value:11}, label:'UV' }
  },
  hourly: {
    rain_mm:      { attention:{op:'>=',value:5},  alert:{op:'>=',value:15}, label:'Chuva' },
    gust_kmh:     { attention:{op:'>=',value:40}, alert:{op:'>=',value:60}, label:'Vento' },
    temp_high_c:  { attention:{op:'>=',value:33}, alert:{op:'>=',value:36}, label:'Calor' },
    temp_low_c:   { attention:{op:'<=',value:5},  alert:{op:'<=',value:2},  label:'Frio' },
    rh_pct:       { attention:{op:'<=',value:30}, alert:{op:'<=',value:20}, label:'Seco' },
    uv:           { alert:{op:'>=',value:11}, label:'UV' }
  }
};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function num(v){ return v===null||v===undefined||v==='' ? null : (Number.isFinite(Number(v)) ? Number(v) : null); }
function fmt(n,d=1){ return num(n)!==null ? Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—'; }
function dow(dateStr){ return new Date(dateStr+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}); }
function showStatus(msg,type='ok'){ const el=$('status'); el.textContent=msg; el.className='status show '+type; }
function hideStatus(){ $('status').className='status'; }
function parseCoords(s){ const m=s.trim().match(/^(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/); if(!m) return null; const lat=+m[1], lon=+m[2]; if(lat<-90||lat>90||lon<-180||lon>180) return null; return {lat,lon}; }

function roundForDisplay(v,digits){ if(num(v)===null)return null; const f=10**digits; return Math.round(Number(v)*f)/f; }
function displayRuleValue(field,v){
  if(field==='uv'||field==='uv_max'||field==='rh_pct'||field==='rh_min_pct') return roundForDisplay(v,0);
  return roundForDisplay(v,1);
}
function compare(v,rule){ if(num(v)===null||!rule) return false; return rule.op==='>=' ? Number(v)>=rule.value : Number(v)<=rule.value; }
function levelFor(v,rule){ if(!rule||num(v)===null)return null; if(rule.alert&&compare(v,rule.alert))return 'alert'; if(rule.attention&&compare(v,rule.attention))return 'attention'; return null; }
function cellClass(level){ return level==='alert'?'cell-alert':level==='attention'?'cell-attention':''; }
function intOrDash(v){ return num(v)===null ? '—' : Math.round(Number(v)).toLocaleString('pt-BR'); }
function isoDateInZone(date, tz='America/Sao_Paulo'){ return new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(date); }
function issuedAt(){ return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()); }

function normalizeText(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function ownPlaceName(x){
  return x && (x.name || String(x.display_name||'').split(',')[0] || '');
}
function ownNameMatchesQuery(x,q){
  const name=normalizeText(ownPlaceName(x));
  const query=normalizeText(q);
  return !!query && name.includes(query);
}
let municipalityCache = null;

async function loadBrazilMunicipalities(){
  if(municipalityCache) return municipalityCache;
  const r=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome');
  if(!r.ok) throw new Error('Falha ao carregar municípios do IBGE.');
  const rows=await r.json();
  municipalityCache=(rows||[]).map(m=>{
    const uf=m.microrregiao?.mesorregiao?.UF || m['regiao-imediata']?.['regiao-intermediaria']?.UF || {};
    return {
      name:m.nome,
      state:uf.nome||'',
      stateCode:uf.sigla||'',
      ibgeId:m.id,
      placeType:'city',
      source:'ibge',
      label:[m.nome,uf.nome,'BR'].filter(Boolean).join(', ')
    };
  });
  return municipalityCache;
}

function classifyNominatimPlace(x){
  const rawType=String(x.type||'').toLowerCase();
  const addressType=String(x.addresstype||'').toLowerCase();
  if(['suburb','neighbourhood','quarter','city_district','borough'].includes(addressType) ||
     ['suburb','neighbourhood','quarter','city_district','borough'].includes(rawType)) return 'neighborhood';
  return 'other';
}
function normalizeNominatimPlace(x){
  const a=x.address||{};
  const placeType=classifyNominatimPlace(x);
  const name=ownPlaceName(x);
  const city=a.city||a.town||a.municipality||a.village||a.city_district;
  const state=a.state||a.region;
  const country=a.country_code ? String(a.country_code).toUpperCase() : a.country;
  const parts=[];
  for(const part of [name, city && normalizeText(city)!==normalizeText(name) ? city : null, state, country]){
    if(part && !parts.includes(part)) parts.push(part);
  }
  return {
    latitude:Number(x.lat), longitude:Number(x.lon),
    label:parts.join(', ') || x.display_name,
    name, source:'nominatim', placeType
  };
}

async function nominatimRawSearch(q,brazilOnly=true){
  const country=brazilOnly?'&countrycodes=br':'';
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&namedetails=1&limit=50&accept-language=pt-BR'+country+'&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok) return [];
  return await r.json();
}

function isCityLikeNominatim(x){
  const t=String(x?.addresstype||x?.type||'').toLowerCase();
  return ['city','town','municipality','village'].includes(t);
}
function normalizeGlobalCity(x){
  const a=x.address||{};
  const name=ownPlaceName(x);
  const state=a.state||a.region||a.province||'';
  const country=a.country_code ? String(a.country_code).toUpperCase() : (a.country||'');
  return {
    latitude:Number(x.lat), longitude:Number(x.lon), name, state, country,
    source:'nominatim-global', placeType:'city',
    label:[name,state,country].filter(Boolean).join(', ')
  };
}
async function globalCitySearch(q){
  const raw=await nominatimRawSearch(q,false).catch(()=>[]);
  const term=normalizeText(parseLocationQuery(q).cityTerm||q);
  let rows=(raw||[])
    .filter(isCityLikeNominatim)
    .filter(x=>{ const n=normalizeText(ownPlaceName(x)); return n===term || n.startsWith(term); })
    .map(normalizeGlobalCity)
    .filter(x=>Number.isFinite(x.latitude)&&Number.isFinite(x.longitude));
  const exact=rows.filter(x=>normalizeText(x.name)===term);
  if(exact.length) rows=exact;
  const seen=new Set();
  return rows.filter(x=>{ const k=normalizeText(x.label); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,100);
}

const BRAZIL_STATES = [
  ['AC','Acre'],['AL','Alagoas'],['AP','Amapá'],['AM','Amazonas'],['BA','Bahia'],['CE','Ceará'],
  ['DF','Distrito Federal'],['ES','Espírito Santo'],['GO','Goiás'],['MA','Maranhão'],['MT','Mato Grosso'],
  ['MS','Mato Grosso do Sul'],['MG','Minas Gerais'],['PA','Pará'],['PB','Paraíba'],['PR','Paraná'],
  ['PE','Pernambuco'],['PI','Piauí'],['RJ','Rio de Janeiro'],['RN','Rio Grande do Norte'],
  ['RS','Rio Grande do Sul'],['RO','Rondônia'],['RR','Roraima'],['SC','Santa Catarina'],
  ['SP','São Paulo'],['SE','Sergipe'],['TO','Tocantins']
];
const STATE_LOOKUP = new Map(BRAZIL_STATES.flatMap(([uf,name])=>[
  [normalizeText(uf),{uf,name}], [normalizeText(name),{uf,name}]
]));

function parseLocationQuery(q){
  const parts=String(q||'').split(',').map(x=>x.trim()).filter(Boolean);
  return {
    cityTerm:parts[0]||'',
    qualifier:parts[1]||'',
    extra:parts.slice(2).join(', ')
  };
}
function locationKey(x){ return x.placeType+'|'+normalizeText(x.label); }
function municipalityMatches(m,term){
  const q=normalizeText(term), n=normalizeText(m.name);
  return !!q && (n===q || n.startsWith(q));
}
function municipalityRank(m,term){
  const q=normalizeText(term), n=normalizeText(m.name);
  if(n===q) return 300;
  if(n.startsWith(q)) return 200;
  return 0;
}
function parentCityNameFromNominatim(x){
  const a=x.address||{};
  return a.city||a.town||a.municipality||a.village||a.county||'';
}

async function searchNeighborhoodsInCity(city, neighborhoodTerm){
  if(!city || !neighborhoodTerm) return [];
  const q=[neighborhoodTerm,city.name,city.state,'Brasil'].filter(Boolean).join(', ');
  const raw=await nominatimRawSearch(q).catch(()=>[]);
  const cityNorm=normalizeText(city.name);
  return (raw||[])
    .filter(x=>ownNameMatchesQuery(x,neighborhoodTerm))
    .filter(x=>normalizeText(parentCityNameFromNominatim(x))===cityNorm)
    .map(normalizeNominatimPlace)
    .filter(x=>x.placeType==='neighborhood' && Number.isFinite(x.latitude) && Number.isFinite(x.longitude));
}

async function locationSearch(q){
  const {cityTerm,qualifier}=parseLocationQuery(q);
  if(!cityTerm) return [];
  const municipalities=await loadBrazilMunicipalities().catch(()=>[]);

  const cityNorm=normalizeText(cityTerm);
  const exactCities=(municipalities||[])
    .filter(m=>normalizeText(m.name)===cityNorm)
    .sort((a,b)=>a.state.localeCompare(b.state,'pt-BR'));

  let cities=(municipalities||[])
    .filter(m=>municipalityMatches(m,cityTerm))
    .sort((a,b)=>municipalityRank(b,cityTerm)-municipalityRank(a,cityTerm) || a.name.localeCompare(b.name,'pt-BR'));

  // SEM VÍRGULA: somente cidades. Brasil usa municípios oficiais do IBGE;
  // se não houver município brasileiro compatível, cai para busca internacional
  // de cidades (Miami, Ushuaia, Londres etc.). Bairros nunca entram aqui.
  if(!qualifier){
    if(exactCities.length) return exactCities.slice(0,100);
    if(cities.length) return cities.slice(0,100);
    return await globalCitySearch(cityTerm);
  }

  // Se o termo após a vírgula for UF/estado brasileiro, refina SOMENTE a cidade.
  const state=STATE_LOOKUP.get(normalizeText(qualifier));
  if(state){
    return cities.filter(m=>m.stateCode===state.uf || normalizeText(m.state)===normalizeText(state.name)).slice(0,100);
  }

  // Se não existe cidade brasileira compatível, interpreta como cidade internacional
  // com estado/província/país (ex.: Miami, Florida). Continua sem bairros.
  if(!cities.length){
    return await globalCitySearch(q);
  }

  // Caso contrário, para cidades brasileiras, a sintaxe é "Cidade, Bairro".
  // Primeiro resolve a cidade; só então procura bairros DENTRO dela.
  const exactCityCandidates=cities.filter(m=>normalizeText(m.name)===normalizeText(cityTerm));
  const targetCities=exactCityCandidates.length ? exactCityCandidates : (cities.length===1 ? cities : []);
  if(!targetCities.length) return cities.slice(0,100);

  const neighborhoodGroups=await Promise.all(targetCities.slice(0,10).map(c=>searchNeighborhoodsInCity(c,qualifier)));
  const neighborhoods=neighborhoodGroups.flat();
  const seen=new Set(), unique=[];
  for(const x of neighborhoods){
    const k=locationKey(x);
    if(seen.has(k)) continue;
    seen.add(k); unique.push(x);
  }
  return unique.slice(0,100);
}

async function geocodeMunicipality(x){
  const q=[x.name,x.state,'Brasil'].filter(Boolean).join(', ');
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=10&countrycodes=br&accept-language=pt-BR&q='+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('Não foi possível localizar o município selecionado.');
  const rows=await r.json();
  const targetName=normalizeText(x.name), targetState=normalizeText(x.state);
  const exact=(rows||[]).find(row=>{
    const a=row.address||{};
    const own=normalizeText(ownPlaceName(row));
    const state=normalizeText(a.state||a.region||'');
    return own===targetName && (!targetState || state===targetState);
  }) || (rows||[]).find(row=>normalizeText(ownPlaceName(row))===targetName) || (rows||[])[0];
  if(!exact) throw new Error('Não foi possível localizar o município selecionado.');
  return {lat:Number(exact.lat),lon:Number(exact.lon),label:x.label};
}

// Camada do fornecedor: The Weather Company (TWC).
// Chave de TESTE fornecida para esta versão. Em produção, use um proxy/backend para não expor a chave no HTML público.
const TWC_API_KEY = '648540689b51413f8540689b51d13f03';
const TWC_BASE = 'https://api.weather.com';

function twcUrl(path,loc){
  const p=new URLSearchParams({
    geocode:`${Number(loc.lat).toFixed(3)},${Number(loc.lon).toFixed(3)}`,
    units:'m', language:'pt-BR', format:'json', apiKey:TWC_API_KEY
  });
  return `${TWC_BASE}${path}?${p.toString()}`;
}

async function twcFetch(path,loc){
  const r=await fetch(twcUrl(path,loc));
  if(!r.ok){
    let detail='';
    try{ detail=(await r.text()).slice(0,180); }catch(_e){}
    const err=new Error(`TWC ${r.status}${detail?': '+detail:''}`);
    err.status=r.status; throw err;
  }
  return r.json();
}

async function fetchWeatherProvider(loc){
  // 3 produtos TWC: previsão diária, previsão horária e histórico diário.
  // Tenta 10 dias horários para completar rajada/UR/UV dos próximos dias;
  // se a chave não tiver esse entitlement, cai automaticamente para 2 dias.
  const dailyP=twcFetch('/v3/wx/forecast/daily/10day',loc);
  const histP=twcFetch('/v3/wx/conditions/historical/dailysummary/30day',loc);
  const hourlyP=twcFetch('/v3/wx/forecast/hourly/10day',loc).catch(e=>{
    if(e && (e.status===401||e.status===403||e.status===404)) return twcFetch('/v3/wx/forecast/hourly/2day',loc);
    throw e;
  });
  const [daily,hourly,historical]=await Promise.all([dailyP,hourlyP,histP]);
  return {daily,hourly,historical};
}

function twcDateTime(s){
  const v=String(s||'');
  return {date:v.slice(0,10),time:v.slice(11,16)};
}
function vals(a){ return (a||[]).map(num).filter(v=>v!==null); }
function maxOrNull(a){ const v=vals(a); return v.length?Math.max(...v):null; }
function minOrNull(a){ const v=vals(a); return v.length?Math.min(...v):null; }
function sumOrNull(a){ const v=vals(a); return v.length?v.reduce((s,x)=>s+x,0):null; }
function predominantDirection(rows){
  const valid=rows.filter(x=>num(x.wind_dir_deg)!==null && num(x.wind_kmh)!==null);
  if(!valid.length) return null;
  let sx=0,sy=0;
  for(const x of valid){ const r=Number(x.wind_dir_deg)*Math.PI/180, w=Math.max(1,Number(x.wind_kmh)); sx+=Math.sin(r)*w; sy+=Math.cos(r)*w; }
  if(Math.abs(sx)<1e-9 && Math.abs(sy)<1e-9) return valid[0].wind_dir_deg;
  return (Math.atan2(sx,sy)*180/Math.PI+360)%360;
}

// Normalização: toda a interface continua usando o mesmo formato canônico da versão anterior.
function normalizeTWC(raw){
  const h=raw.hourly||{}, d=raw.daily||{};
  const hist=Array.isArray(raw.historical)?(raw.historical[0]||{}):(raw.historical||{});

  const hourly=(h.validTimeLocal||[]).map((t,i)=>{
    const dt=twcDateTime(t);
    return {
      datetime:t, epoch:num(h.validTimeUtc?.[i]), date:dt.date, time:dt.time,
      temp_c:num(h.temperature?.[i]), rh_pct:num(h.relativeHumidity?.[i]), rain_mm:num(h.qpfRain?.[i]) ?? num(h.qpf?.[i]),
      rain_prob_pct:num(h.precipChance?.[i]), wind_kmh:num(h.windSpeed?.[i]), wind_dir_deg:num(h.windDirection?.[i]),
      gust_kmh:num(h.windGust?.[i]), uv:num(h.uvIndex?.[i])
    };
  });
  const byDate={};
  for(const row of hourly){ (byDate[row.date] ||= []).push(row); }

  const forecastDaily=(d.validTimeLocal||[]).map((t,i)=>{
    const date=twcDateTime(t).date;
    const hs=byDate[date]||[];
    const dp=(d.daypart&&d.daypart[0])||{};
    const dpStart=i*2, dpEnd=dpStart+2;
    const slice=name=>(dp[name]||[]).slice(dpStart,dpEnd);
    return {
      date,
      temp_min_c:num(d.temperatureMin?.[i]) ?? minOrNull(hs.map(x=>x.temp_c)),
      temp_max_c:num(d.temperatureMax?.[i]) ?? maxOrNull(hs.map(x=>x.temp_c)),
      rh_min_pct:minOrNull(hs.map(x=>x.rh_pct)) ?? minOrNull(slice('relativeHumidity')),
      rh_max_pct:maxOrNull(hs.map(x=>x.rh_pct)) ?? maxOrNull(slice('relativeHumidity')),
      rain_mm:num(d.qpfRain?.[i]) ?? num(d.qpf?.[i]) ?? sumOrNull(hs.map(x=>x.rain_mm)),
      rain_prob_pct:maxOrNull(hs.map(x=>x.rain_prob_pct)) ?? maxOrNull(slice('precipChance')),
      wind_max_kmh:maxOrNull(hs.map(x=>x.wind_kmh)) ?? maxOrNull(slice('windSpeed')),
      wind_dir_deg:predominantDirection(hs) ?? (()=>{ const a=vals(slice('windDirection')); return a.length?a[0]:null; })(),
      gust_kmh:maxOrNull(hs.map(x=>x.gust_kmh)),
      uv_max:maxOrNull(hs.map(x=>x.uv)) ?? maxOrNull(slice('uvIndex'))
    };
  });

  // O resumo histórico de 30 dias da TWC fornece temperatura e precipitação.
  // Campos não publicados nesse produto (UR, probabilidade, vento/rajada e UV) ficam como —.
  const historicalDaily=(hist.validTimeLocal||[]).map((t,i)=>({
    date:twcDateTime(t).date,
    temp_min_c:num(hist.temperatureMin?.[i]), temp_max_c:num(hist.temperatureMax?.[i]),
    rh_min_pct:null, rh_max_pct:null,
    rain_mm:num(hist.rain24Hour?.[i]) ?? num(hist.precip24Hour?.[i]), rain_prob_pct:null,
    wind_max_kmh:null, wind_dir_deg:null, gust_kmh:null, uv_max:null
  })).sort((a,b)=>a.date.localeCompare(b.date));

  const todayDate=forecastDaily[0]?.date || hourly[0]?.date || isoDateInZone(new Date());
  const past=historicalDaily.filter(x=>x.date<todayDate).slice(-2);
  const daily=[...past,...forecastDaily];
  return { timezone:'Horário local TWC', todayDate, hourly, daily };
}

async function run(loc){
  $('suggest').style.display='none'; $('results').innerHTML=''; $('location').className='card location'; if($('exportBtn')) $('exportBtn').disabled=true; $('loader').className='loader show'; $('go').disabled=true; hideStatus();
  try{
    let label=loc.label; if(loc.reverse){ const rev=await reverseLabel(loc.lat,loc.lon); if(rev) label=rev; }
    const raw=await fetchWeatherProvider(loc); const data=normalizeTWC(raw); render(label,loc.lat,loc.lon,data);

function windDirLabel(deg){

}

function hourlyLevels(x){

function hourlyAlertLabels(x,lv){

function tableHourly(rows,date){
  const nowSec=Date.now()/1000;
  let closestEpoch=null;
  for(const r of rows){ if(num(r.epoch)!==null && (closestEpoch===null || Math.abs(r.epoch-nowSec)<Math.abs(closestEpoch-nowSec))) closestEpoch=r.epoch; }
  const isCurrentDate=rows.some(r=>num(r.epoch)!==null && Math.abs(r.epoch-nowSec)<=5400);
  return `<div class="card tablecard"><div class="scroll"><table class="hourly-table"><thead><tr><th>Hora</th><th>Destaques</th><th>Temp. °C</th><th>UR %</th><th>Chuva mm</th><th>Prob. %</th><th>Vento km/h</th><th>Dir.</th><th>Rajada km/h</th><th>UV</th></tr></thead><tbody>${rows.map(x=>{

  }).join('')}</tbody></table></div></div>`;
}

  out+=legendHtml();
  out+=`<div class="section"><h2>Últimos 2 dias</h2><p>Resumo diário</p></div>`+tableDaily(past,true);
  out+=`<div class="section"><h2>Hoje — por hora</h2><p>${esc(dow(todayRow.date))}</p></div>`;
  if(todayRow){ out+=`<div class="summary"><div class="kpi"><b>${fmt(todayRow.temp_min_c)} °C</b><span>Temperatura mínima</span></div><div class="kpi"><b>${fmt(todayRow.temp_max_c)} °C</b><span>Temperatura máxima</span></div><div class="kpi"><b>${fmt(todayRow.rain_mm)} mm</b><span>Chuva no dia</span></div><div class="kpi"><b>${fmt(todayRow.gust_kmh)} km/h</b><span>Rajada máxima</span></div></div>`; }
  out+=tableHourly(todayHourly,todayRow.date);
  out+=`<div class="section"><h2>Amanhã — por hora</h2><p>${esc(dow(tomorrowRow.date))}</p></div>`+tableHourly(tomorrowHourly,tomorrowRow.date);
  out+=`<div class="section"><h2>Próximos dias</h2><p>Resumo diário</p></div>`+tableDaily(future,false);
  out+=`<div class="footer-note">Versão piloto para teste de usabilidade em campo. Fonte meteorológica desta versão: The Weather Company (TWC). Regras, destaques e apresentação preservados; dados indisponíveis em determinado produto TWC aparecem como —.</div>`;
  $('results').innerHTML=out;
}
</script>
</body>
</html>
